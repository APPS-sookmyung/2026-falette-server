services:
  postgres:
    image: postgres:16
    container_name: falette-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: falette
      POSTGRES_USER: falette
      POSTGRES_PASSWORD: falette
    ports:
      - "5432:5432"
    volumes:
      - falette-pg-data:/var/lib/postgresql/data

volumes:
  falette-pg-data:
