# 배포용 - PostgreSQL. 값은 전부 환경 변수로 주입 (레포에 실제 값 커밋 금지)
spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    show-sql: false

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope: profile, email

server:
  servlet:
    session:
      cookie:
        # 프론트와 백엔드 도메인이 다르면 쿠키가 전달되도록 None + Secure(HTTPS 필수)
        same-site: none
        secure: true

app:
  cors-allowed-origins: ${FRONTEND_ORIGINS}
  login-success-redirect-url: ${LOGIN_SUCCESS_REDIRECT_URL}
  login-failure-redirect-url: ${LOGIN_FAILURE_REDIRECT_URL}
